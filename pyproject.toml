[project]
name = "idi-manageorders-sdk"
version = "0.8.0"
description = "ShopWorks ManageOrders API SDK"
authors = [
    { name = "Bradley Reynolds", email = "bradley.reynolds@impressdesigns.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1", "pydantic>=2.14.1"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # DX
    "nox>=2026.10.20",
    "pre-commit>=4.6.2",
    # Linters
    "ruff>=0.17.1",
    "mypy>=2.4.0",
]
docs = [
    "sphinx>=8.1.3",
    # Theme
    "furo>=2025.12.19",
    # Extensions
    "sphinx-autoapi>=3.8.1",
    "releases>=2.1.1",
]
tests = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    # Extensions
    "pytest-randomly>=5.0.0",
]

[project.urls]
repository = "https://github.com/impressdesigns/manageorders-sdk/"
documentation = "https://impressdesigns.dev/manageorders-sdk/"

[tool.uv]
# certifi 2026.10.19 is the release that distrusts the compromised eMudhra/emSign
# intermediates (October 2026); it is exempt from exclude-newer until it ages past the window.
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.uv.build-backend]
module-name = "manageorders_sdk"

[tool.ruff]
target-version = "py312"
line-length = 130

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # (Missing copyright notice at top of file) - No license
]

[tool.ruff.lint.extend-per-file-ignores]
"docs/*" = [
    "INP001", # (File `docs/conf.py` is part of an implicit namespace package. Add an `__init__.py`.) - Docs are not modules
]
"tests/*" = [
    "S101",   # (Use of `assert` detected) - Yes, that's the point
]

[tool.ruff.lint.isort]
known-first-party = ["manageorders_sdk"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["manageorders_sdk"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
